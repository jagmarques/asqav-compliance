name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
jobs:
  lint:
    runs-on: [self-hosted, hz-ci-light]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    runs-on: [self-hosted, hz-ci-light]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test

  audit:
    runs-on: [self-hosted, hz-ci-light]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  dist:
    runs-on: [self-hosted, hz-ci-light]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- dist

  ci-ok:
    if: ${{ always() }}
    needs: [lint, test, audit, dist]
    runs-on: [self-hosted, hz-ci-light]
    steps:
      - name: Gate
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.audit.result }}" != "success" ] || [ "${{ needs.dist.result }}" != "success" ]; then
            echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} audit=${{ needs.audit.result }} dist=${{ needs.dist.result }}"
            exit 1
          fi
