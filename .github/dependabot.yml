version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # ncc 0.45 ts-loader breaks against typescript 7 (fileExists undefined); pinned to 0.44
      - dependency-name: "@vercel/ncc"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
